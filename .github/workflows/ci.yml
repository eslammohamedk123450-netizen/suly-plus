name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.3

      - name: Upgrade npm to a version with the Arborist peer-set fix
        run: |
          npm install --global npm@11.21.2
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fail on moderate or higher dependency vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Report dependency security advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify(Object.values(a.vulnerabilities || {}).map(v => ({name:v.name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable})), null, 2));"

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Create production build
        run: npm run build

      - name: Build production Docker image
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL=https://example.supabase.co \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder \
            --tag suly-plus-web:ci .

      - name: Smoke-test production Docker container
        run: |
          docker run -d --name suly-plus-smoke \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            -p 127.0.0.1:8080:8080 \
            suly-plus-web:ci
          trap 'docker rm -f suly-plus-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ -o /tmp/suly-index.html; then
              break
            fi
            sleep 1
          done
          grep -q 'id="root"' /tmp/suly-index.html
          curl --fail --silent http://127.0.0.1:8080/account/orders -o /dev/null
          docker exec suly-plus-smoke nginx -t
