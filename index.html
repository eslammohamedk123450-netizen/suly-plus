<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Suly Plus — منصة التجارة الإلكترونية لإدارة متجرك وتنمية أعمالك." />
    <title>Suly Plus | منصة التجارة الإلكترونية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const route = new URLSearchParams(window.location.search).get('p');
        if (route === null) return;
        const basePath = '/suly-plus/';
        const target = new URL(basePath + route.replace(/^\\/+/, ''), window.location.origin);
        if (!target.pathname.startsWith(basePath)) return;
        window.history.replaceState({}, '', target.pathname + target.search + target.hash);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
